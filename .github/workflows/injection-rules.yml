name: Existing extensions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Check the declared Bun runtime
        run: test "$(bun --version)" = "$(cat .bun-version)"
      - name: Check included runtime copies
        run: bun scripts/sync-plugin-runtime.mjs --check
      - name: Check the Linux lock helper
        run: /usr/bin/flock --version
      - name: Run all ordinary extension checks
        run: bun scripts/test.mjs
